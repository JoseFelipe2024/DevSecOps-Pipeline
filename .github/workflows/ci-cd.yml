name: CI/CD Pipeline DevSecOps

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# permisos minimos que necesita el pipeline
permissions:
  contents: read
  actions: read
  security-events: write   # para subir el SARIF de Trivy a la pestaña Security

jobs:

  Build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t vuln-app ./app

      - name: Save Docker image as tar
        run: docker save vuln-app -o vuln-app.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: vuln-app-image
          path: vuln-app.tar
          retention-days: 3


  # ---------------- SAST ----------------
  SAST-SonarCloud:
    runs-on: ubuntu-latest
    needs: Build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # sonarcloud-github-action esta deprecada, se cambia por sonarqube-scan-action
      - name: Analisis SAST con SonarCloud
        uses: SonarSource/sonarqube-scan-action@v8.5.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # El quality gate por defecto (Sonar way) solo revisa codigo nuevo, por eso
      # pasaba en verde aunque hubiera vulnerabilidades BLOCKER en el codigo viejo.
      # Esta puerta consulta la API y bloquea si hay vulnerabilidades BLOCKER o CRITICAL.
      - name: Puerta de seguridad SAST
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          TASK_URL=$(grep ceTaskUrl .scannerwork/report-task.txt | cut -d= -f2-)
          PROJECT=$(grep '^sonar.projectKey' sonar-project.properties | cut -d= -f2)

          # esperar a que SonarCloud termine de procesar el analisis
          for i in $(seq 1 30); do
            STATUS=$(curl -s -u "$SONAR_TOKEN:" "$TASK_URL" | jq -r .task.status)
            echo "Estado del analisis en SonarCloud: $STATUS"
            if [ "$STATUS" = "SUCCESS" ]; then break; fi
            if [ "$STATUS" = "FAILED" ] || [ "$STATUS" = "CANCELED" ]; then exit 1; fi
            sleep 5
          done

          curl -s -u "$SONAR_TOKEN:" \
            "https://sonarcloud.io/api/issues/search?componentKeys=$PROJECT&types=VULNERABILITY&severities=BLOCKER,CRITICAL&resolved=false&ps=100" \
            > sonar-issues.json
          TOTAL=$(jq .total sonar-issues.json)

          echo "Vulnerabilidades BLOCKER/CRITICAL encontradas: $TOTAL"
          jq -r '.issues[] | "\(.severity) | linea \(.line) | \(.rule) | \(.message)"' sonar-issues.json

          # resumen para que se vea en la pagina del run
          echo "### SAST - SonarCloud" >> $GITHUB_STEP_SUMMARY
          echo "Vulnerabilidades BLOCKER/CRITICAL: **$TOTAL**" >> $GITHUB_STEP_SUMMARY
          jq -r '.issues[] | "- \(.severity) linea \(.line): \(.message)"' sonar-issues.json >> $GITHUB_STEP_SUMMARY

          if [ "$TOTAL" -gt 0 ]; then
            echo "::error::Puerta SAST bloqueada: hay $TOTAL vulnerabilidades BLOCKER/CRITICAL"
            exit 1
          fi


  # ---------------- SCA + imagen ----------------
  SCA-Trivy:
    runs-on: ubuntu-latest
    needs: Build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: vuln-app-image

      - name: Load image into Docker
        run: docker load -i vuln-app.tar

      # trivy-action fijado por SHA: en marzo 2026 le reescribieron los tags
      # y solo el 0.35.0 quedo limpio. Fijar por SHA evita ese tipo de ataque.
      - name: SCA de dependencias (requirements.txt)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          scan-type: fs
          scan-ref: ./app
          severity: 'CRITICAL,HIGH'
          format: table
          exit-code: 0

      - name: Escaneo de la imagen (reporte SARIF)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: vuln-app
          severity: 'CRITICAL,HIGH'
          format: sarif
          output: trivy-results.sarif
          limit-severities-for-sarif: true
          exit-code: 0
          skip-setup-trivy: true

      - name: Upload results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif

      # esta es la puerta: si hay algo HIGH o CRITICAL el job falla
      - name: Puerta de seguridad SCA / contenedor
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: vuln-app
          severity: 'CRITICAL,HIGH'
          format: table
          exit-code: 1
          skip-setup-trivy: true


  # ---------------- DAST ----------------
  DAST-ZAP:
    runs-on: ubuntu-latest
    needs: [Build, SAST-SonarCloud, SCA-Trivy]
    # para el laboratorio corre aunque fallen las otras puertas, asi se ven las 3.
    # En un pipeline real se quita el always() y el DAST no corre si algo fallo antes.
    if: ${{ always() && needs.Build.result == 'success' }}
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: vuln-app-image

      - name: Load image into Docker
        run: docker load -i vuln-app.tar

      - name: Start vulnerable app
        run: docker run -d --name vuln-app --network host vuln-app

      - name: Wait for app to be ready
        run: |
          for i in $(seq 1 15); do
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/ | grep -q "200"; then
              echo "La app respondio en el intento $i"
              exit 0
            fi
            echo "Intento $i/15, todavia no responde..."
            sleep 2
          done
          docker logs vuln-app
          exit 1

      # fail_action solo acepta true/false (el 'high' del repo original no hacia nada)
      # y el input correcto es allow_issue_writing, no allow_issue_creation
      - name: OWASP ZAP Full Scan
        uses: zaproxy/action-full-scan@v0.13.0
        with:
          target: 'http://localhost:8000'
          fail_action: false
          allow_issue_writing: false
          cmd_options: '-j'
          artifact_name: zap-report

      # puerta propia: solo bloquea con alertas de riesgo ALTO (riskcode 3)
      - name: Puerta de seguridad DAST
        run: |
          ALTOS=$(jq '[.site[].alerts[] | select(.riskcode=="3")] | length' report_json.json)
          echo "Alertas de riesgo ALTO: $ALTOS"
          jq -r '.site[].alerts[] | select(.riskcode=="3") | "- \(.name) (\(.count) instancias)"' report_json.json

          echo "### DAST - OWASP ZAP" >> $GITHUB_STEP_SUMMARY
          echo "Alertas de riesgo ALTO: **$ALTOS**" >> $GITHUB_STEP_SUMMARY
          jq -r '.site[].alerts[] | select(.riskcode=="3") | "- \(.name)"' report_json.json >> $GITHUB_STEP_SUMMARY

          if [ "$ALTOS" -gt 0 ]; then
            echo "::error::Puerta DAST bloqueada: ZAP encontro $ALTOS alertas de riesgo alto"
            exit 1
          fi
